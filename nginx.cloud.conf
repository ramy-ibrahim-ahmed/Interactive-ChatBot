server {
    listen 8080; # Changed from 80 for Cloud Run
    root /usr/share/nginx/html;
    index /templates/chat.html;

    location / {
        try_files $uri $uri/ /templates/chat.html;
    }

    # Mount point for GCS bucket
    location /temp-audio/ {
        alias /usr/share/nginx/html/temp-audio/;
    }

    location /api/v1/ {
        proxy_pass https://onyx-api-113108380596.us-central1.run.app;
        proxy_ssl_server_name on;
        proxy_set_header Host onyx-api-113108380596.us-central1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}